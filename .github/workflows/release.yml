name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go test ./...

      - run: make release

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        # alpha and beta tags are prereleases, so sablier update and install.sh skip them
        run: |
          pre=
          case "$GITHUB_REF_NAME" in *-alpha*|*-beta*) pre=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes $pre
